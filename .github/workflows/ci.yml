name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      # 只打免安装目录，验证打包配置（含 uiohook-napi 预编译文件）可用；不上传
      - name: Smoke-test packaging
        run: npx electron-builder --win --dir --publish never
