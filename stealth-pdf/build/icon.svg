<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>StealthPDF</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f7dff"/>
      <stop offset="0.55" stop-color="#3b33c4"/>
      <stop offset="1" stop-color="#1a1471"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.28" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- 纸张：下半部分逐渐淡出，象征“隐身” -->
    <linearGradient id="page" gradientUnits="userSpaceOnUse" x1="0" y1="176" x2="0" y2="848">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4e8ff"/>
      <stop offset="1" stop-color="#aeb7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0b0640" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 圆角底板 -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#gloss)"/>

  <!-- 纸张 + 折角 -->
  <g filter="url(#shadow)">
    <path d="M262 224 Q262 176 310 176 H626 L762 312 V800 Q762 848 714 848 H310 Q262 848 262 800 Z" fill="url(#page)"/>
  </g>
  <path d="M626 176 L626 276 Q626 312 662 312 H762 Z" fill="url(#fold)"/>

  <!-- 眼睛：窥视 / 隐藏 -->
  <path d="M316 566 Q512 396 708 566 Q512 736 316 566 Z" fill="#ffffff" stroke="#2a2599" stroke-width="40" stroke-linejoin="round"/>
  <circle cx="512" cy="566" r="82" fill="#2a2599"/>
  <circle cx="540" cy="538" r="25" fill="#ffffff"/>

  <!-- 文字行（装饰） -->
  <rect x="338" y="256" width="170" height="30" rx="15" fill="#c3caff"/>
  <rect x="338" y="316" width="250" height="30" rx="15" fill="#d6dbff"/>
</svg>
